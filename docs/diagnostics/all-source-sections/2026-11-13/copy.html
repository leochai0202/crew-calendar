<button type="button" data-copy="g1-zh">复制 原文复制稿 / SOURCE COPY — NOT FOR RELEASE ZH</button><textarea id="g1-zh" readonly rows="18">我是来自飞行十五中队的副驾驶段洋硕，目前技术级别A2，晋级日期1月13日，本阶段经历时间93小时，起落21个，近90天起落8个，近30天起落8个，近3个月已运行过三亚凤凰机场，上一次实际操纵落地为10月1日上海浦东机场。

上一次飞行中机长/教员对我优缺点的评价（作为PF/PM各取最近一次）：

上一次作为PF教员评价：30尺以下带杆量欠一点；着陆后快速脱离道口前及时减速至30节以下。

作为PM机长评价：增加SOP熟练度，标准喊话声音大一些。

典型不安全事件：

上海浦东机场：

曾因低高度鸟击导致雷达罩处损伤超标。

曾发生更改跑道后输错飞行计划事件。

三亚凤凰机场：

曾发生1000ft（AAL）未建立着陆形态。

曾发生滑错路线事件。

曾发生偏离指令高度事件。

核心威胁：

上海浦东机场：

机坪有时给推出开车指令，有时候给推出到位报告指令，注意识别并遵守指令。

请注意 E，T1 滑行道关闭未在航行通告上说明，机组请参考施工区域图（2C-1-SUP）。

地面运行换频频繁，换频指令与滑行等待位置较近，注意，防止滑错/滑过线。

离场方式在滑行时也可能发生变更，在变更离场方式后，及时遵循 SOP 离场变更执行更改计划，并做好补充简令，执行离场变更检查单，避免飞错。

浦东机场离地后自动脱波，脱波频率按照 PDC 或放行许可。

从BK 进场，若向北运行时，通常用西跑道 35L 号，若向南运行时，通常东跑道 16L。

进场程序较多，有时会临时更改，在非繁忙时刻通常会有直飞，做好预案。

浦东向南进近过程中曾多次触发 TA/RA 告警，请进近准备时做好相关预案，按照手册记忆项目程序执行。

浦东 17R/35L 跑道，ATC 可能指挥短切五边或较晚发布盲降许可，做好预判并提前做好能量管理，积极沟通，按需接受 ATC 雷达引导的指令。当需要实施&quot;从上方截获下滑道&quot;程序时，严格遵循 SOP 要求，如无法满足稳定进近标准，果断复飞或中止进近。

34R 进近，PD083 和 PD084 中间偏右有较高障碍物，下降或保持 600m 从上方飞过可能触发 GPWS 警戒，机组参考 EFB 中“关于浦东 34R 跑道进近触发 GPWS 警戒的提示”操作通告执行。

通常 16R/34L 和 17L/35R 用于起飞，16L/34R 和 17R/35L 用于着陆（低能见度运行除外）。

近期发生多次浦东机场 168 号停机位，因上坡和单发原因油门加至地面最大可用推力仍不能移动飞机，而关车申请拖车。请注意在此类停机位的进位速度。

浦东机场细则要求，AD2.20，3.2.4&quot;进港航空器机组发现地面滑行引导车后关闭滑行灯，跟随地面滑行引导车滑行&quot;。

在进入设置目视泊位引导系统的机位时，发现有疑问的引导指示，或进入由人工引导入位的机位时发现地面接机人员未就位（尤其是着陆后临时更换机位时常发生），应当立即停止滑行，及时通报 ATC，并应当保持发动机运转，等待后续处置。

机场标高：13ft。

跑道信息：16L/34R（3800m×60m）；16R/34L（3800m×60m）；17L/35R（4000m× 60m）；17R/35L（3400m×60m）。

低高度爬升相对飞机较多。

冬季运行经常低能见、低云，请做好相关准备。

浦东机场驱鸟炮声音较响，不要产生惊吓效应。

三亚凤凰机场：

滑行路线较复杂，A3、A4滑行道在A滑与跑道中间无中线灯，机组脱离跑道时注意观察道面，尤其夜间下雨，防止偏出道面。

滑出有时跟引导车；若无引导车，尤其夜间需仔细观察道口指示标识与机坪飞机，A3滑行道夜间辨识度较差。

三亚停机位301，离场地面滑行阶段，地面指挥A1在B 前等，B没有标志牌，只有地面标识，注意识别和控制滑行速度，尤其夜间滑行，且滑行距离较短，注意慢车时间限制。

08号常用PORAP-1N，通常放行中会要求7200M过 PORAP，性能一般可以满足。

当部队活动时，可能会传统离场，且注意PORAP的速度限制。

离港交给三亚区调会指挥上RVSM高度，并且指令NUMKU 之前到达。

26号跑道进近飞机较多时，指挥下高度偏晚，注意及时减速控制飞机能量。

三亚分别有盲降Y和Z两种程序，需提前收听通波确认，通常为Z程序，但是管制通常不会指明使用哪一种，请注意，避免飞错。

VOR08号跑道进近，进场航路可能偏高，注意高距比。程序转弯时管制会指挥下900建立下滑，而程序是700m建立下滑，可以和管制申请按程序下高度建立下滑。

五边乱流。

浦东-三亚，交广州区域BEGMO后可能指挥飞DST LJG LJG后加入A470到DOTMI，DOTMI附近可能开始联系香港120.3 要求保持航向后直飞ALLEY。

ZSPD-ZJSY：航路经M503过香港区域，DOTMI前换频HK RADAR121.3，指挥DOTMI之后直飞ALLEY，后续换频HK121.7，指挥直飞SIKOU，SIKOU前换频三亚133.35。

机场标高：94ft。

三亚26号跑道等待点，位置在跑道侧方，夜间等待点灯光较暗，加强地面观察，避免滑过造成跑道入侵。

减噪程序：详见细则2.21.2。

释压程序：详见EFB。

无线电失效程序：参阅细则2.22.5。
</textarea>
<button type="button" data-copy="g1-en">复制 原文复制稿 / SOURCE COPY — NOT FOR RELEASE EN</button><textarea id="g1-en" readonly rows="18">I am Duan Yangshuo, a First Officer in Flight Squadron 15. My current technical level is A2, and my promotion date is January 13. In this qualification stage, I have 93 hours and 21 takeoffs and landings. I have completed 8 landings in the last 90 days and 8 landings in the last 30 days. Within the past three months, I have operated at Sanya Phoenix International. My most recent landing as PF was at Shanghai Pudong International Airport on October 1.

Latest PF/PM feedback:

As PF, the instructor noted that below 30 ft I should use slightly more aft-stick input and, after landing, decelerate below 30 kt before entering the rapid-exit taxiway.

As PM, the captain noted that I should improve SOP proficiency and make standard callouts more audible.

Typical unsafe events:

Shanghai Pudong International Airport:

Low-altitude bird strike incidents have caused excessive radome damage.

Flight-plan data-entry errors occurred following runway re-assignment.

Sanya Phoenix International Airport:

A failed landing attempt occurred at 1000 feet (AAL).

History of route deviation incidents.

A deviation from the commanded altitude has occurred.

Core threats:

Shanghai Pudong International Airport:

Apron control may issue push-back and start-up clearance, or instruction to report push-back complete. It is required to identify and comply with relevant clearances.

Closure of Taxiway E and Taxiway T1 is NOT published in NOTAMs. Refer to construction area chart (2C-1-SUP).

Frequent frequency changes occur during surface movement. Frequency change points are geographically close to taxi holding positions. Exercise vigilance to prevent taxi routing errors or overshooting holding lines.

Departure procedure may be amended while taxiing. Upon departure-mode revision, execute SOP for departure change, update flight plan, conduct supplementary briefing and apply departure-change checklist to avoid track deviation.

Automatic frequency hand-off upon lift-off at Pudong. Handoff frequency shall be in accordance with PDC or ATC departure clearance.

For BK arrival: during north-bound operations, RWY 35L (western runway) is normally assigned; during south-bound operations, RWY 16L (eastern runway) is normally assigned.

Multiple arrival procedures are in use, with ad-hoc amendments possible. Direct-to clearances are common during off-peak periods. Maintain contingency plans.

Multiple TA/RA alerts have been recorded during south-bound approaches into Pudong. Prepare contingency measures during approach preparation and execute memory-item procedures per aircraft manual.

For RWY 17R / 35L, ATC may assign short base-leg vectors or issue ILS clearance at a late stage. Anticipate such scenarios, conduct proactive energy management, maintain active communication and accept ATC radar vectors as required. When performing “glideslope capture from above” procedure, strictly comply with SOP. If stable-approach criteria cannot be satisfied, execute missed approach or discontinued approach without hesitation.

For RWY 34R approach, tall obstacles exist slightly right-of-track between waypoints PD083 and PD084. Over-flying at or maintaining 600 m may trigger GPWS caution alerts. Follow the operational advisory “Reminder on GPWS Caution Triggers for RWY 34R Approaches at Pudong” available in EFB.

Several recent incidents occurred at Stand 168: due to uphill gradient and single-engine taxi condition, aircraft could not move even with maximum available ground thrust, requiring engine shutdown and tow-in service. Control taxi speed when docking at stands with such gradients.

Per Pudong Aerodrome Instructions AD2.20, 3.2.4: “Upon sighting marshalling vehicle, arriving crews shall switch off taxi lights and follow the marshalling vehicle”.

When taxiing towards stands equipped with Visual Docking Guidance System (VDGS): stop taxi immediately if receiving ambiguous guidance indications. When entering stands with manual marshalling, stop taxi if ground marshalling personnel are not on-site (frequently encountered after ad-hoc stand change post-landing). Notify ATC promptly, keep engines running and await further instructions.

Airport elevation: 13 ft.

Runway Information: 16L/34R (3800 m × 60 m); 16R/34L (3800 m × 60 m); 17L/35R (4000 m × 60 m); 17R/35L (3400 m × 60 m).

Low-visibility and low-ceiling conditions prevail frequently in winter. Make adequate preparations accordingly.

Bird-scare cannon blasts are loud at Pudong. It is required to avoid undesired startle response.

Normally RWY 16R/34L and 17L/35R for departures; RWY 16L/34R and 17R/35L for arrivals (except low-visibility operations).

Heavy volume of aircraft climbing atlow altitudes.

Sanya Phoenix International Airport:

The commonly used PORAP-1N model (model 08) typically requires a 7200M PORAP during release procedures, and its performance generally meets the requirements. When troops are active, they may depart traditionally, and note the speed limit of PORAP. The aircraft is handed over to the Sanya District Air Traffic Control Center for command, which sets the RVSM (Real-Time Vertical Management System) altitude and instructsthe aircraft to reach the designated position before NUMKU.

From Pudong to Sanya, after connecting with the Guangzhou regional BEGMO, the flight may be directed to DST LJG LJG, then join A470 to DOTMI. Near DOTMI, contact may be initiated with Hong Kong 120.3 to request maintaining the current heading and proceeding directly to ALLEY.

ZSPD-ZJSY: The flight route passes through the Hong Kong area via M503, switching to HK RADAR 121.3 before DOTMI. After DOTMI, it flies directly to ALLEY, then switches to HK121.7 for direct flight to SIKOU, and finally switches to Sanya 133.35 before SIKOU.

When there are many aircraft approaching Runway 1.26, the command may delay the altitude control, and the crew should promptly reduce speed to control the aircraft&#x27;s energy.

Sanya has two emergency landing procedures (Y and Z), both requiring prior radio confirmation. While Z procedure is typically used, air traffic control rarely specifies which one to follow. It is recommended to remain vigilant to avoid misapplication.

Approach to Runway 08 (VOR08). The approach path may be at a higher altitude, so monitor the altitude-to-range ratio. During the procedure turn, air traffic control will direct a 900- meter downward slope, whereas the procedure specifies a 700- meter downward slope. You may request to execute the procedure down slope with the control&#x27;s approval.

The taxiing route is complex. There is no center line light between the A3 and A4 taxiways and the runway. It is recommended to observe the runway surface carefully when leaving the runway, especially at night when it is raining, to prevent deviation from the runway.

Five-sided Chaos.

Roll-out operations may require a guide vehicle; in the absence of such guidance, particularly at night, close monitoring of approach path markings and aircraft on the apron is essential, as the A3 taxiway exhibits reduced visibility during nighttime operations.

At Sanya&#x27;s apron 301 during ground taxiing, ground controller A1 should wait in front of B. As B has no signage only ground markings, drivers must carefully identify and control taxiing speed—especially at night with shorter taxiing distances—and strictly adhere to the slow-moving vehicle time limit.

Noise reduction procedure: Refer to Section 2.21.2 for details.

Pressure relief procedure: Refer to EFB for details.

Radio failure procedure: Refer to Rule 2.22.5.
