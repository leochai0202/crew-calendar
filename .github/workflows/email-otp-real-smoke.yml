name: Isolated email OTP real smoke

on:
  push:
    branches:
      - smoke/email-otp-real-20260913

permissions:
  contents: read

concurrency:
  group: crew-calendar
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: [self-hosted, Windows, X64, crew-calendar]
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Materialize isolated smoke files from GitHub Contents API
        id: bootstrap
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SMOKE_TARGET_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $smokeStage = "PREPARE_WORKSPACE"
          $requiredFiles = @(
            "scripts/email_otp_real_smoke.py",
            "password_email_auth.py",
            "springair_email_otp.py",
            "authenticate_crew_session.py",
            "crew_auth_session.py",
            "imap_otp.py"
          )

          function New-DirectHttpClient {
            $handler = [System.Net.Http.HttpClientHandler]::new()
            $handler.UseProxy = $false
            $handler.AllowAutoRedirect = $false
            $client = [System.Net.Http.HttpClient]::new($handler)
            $client.Timeout = [TimeSpan]::FromSeconds(45)
            $client.DefaultRequestHeaders.UserAgent.ParseAdd("crew-email-smoke-bootstrap")
            return $client
          }

          function Save-ContentsFile {
            param(
              [Parameter(Mandatory = $true)][string]$RelativePath,
              [Parameter(Mandatory = $true)][string]$Workspace
            )
            if ($RelativePath -notin $requiredFiles) {
              throw "SMOKE_FILE_NOT_ALLOWED"
            }
            $workspaceFull = [IO.Path]::GetFullPath($Workspace)
            $targetPath = [IO.Path]::GetFullPath((Join-Path $workspaceFull $RelativePath))
            if (-not $targetPath.StartsWith(
              $workspaceFull.TrimEnd([IO.Path]::DirectorySeparatorChar) +
                [IO.Path]::DirectorySeparatorChar,
              [StringComparison]::OrdinalIgnoreCase
            )) {
              throw "SMOKE_FILE_OUTSIDE_WORKSPACE"
            }
            $uri = (
              "https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/" +
              "$RelativePath`?ref=$env:SMOKE_TARGET_SHA"
            )
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              $client = $null
              Write-Host "SMOKE_FETCH_PATH=$RelativePath"
              Write-Host "SMOKE_FETCH_ATTEMPT=$attempt"
              try {
                $client = New-DirectHttpClient
                $request = [System.Net.Http.HttpRequestMessage]::new(
                  [System.Net.Http.HttpMethod]::Get, $uri
                )
                try {
                  $request.Headers.Authorization = (
                    [System.Net.Http.Headers.AuthenticationHeaderValue]::new(
                      "Bearer", $env:GITHUB_TOKEN
                    )
                  )
                  $request.Headers.Accept.ParseAdd("application/vnd.github+json")
                  $request.Headers.Add("X-GitHub-Api-Version", "2022-11-28")
                  $response = $client.SendAsync($request).GetAwaiter().GetResult()
                  try {
                    Write-Host "SMOKE_BOOTSTRAP_HTTP_STATUS=$([int]$response.StatusCode)"
                    if (-not $response.IsSuccessStatusCode) {
                      throw "SMOKE_CONTENTS_HTTP_FAILED"
                    }
                    $body = $response.Content.ReadAsStringAsync().GetAwaiter().GetResult()
                    $file = $body | ConvertFrom-Json
                    if ([string]$file.type -ne "file" -or
                        [string]$file.path -ne $RelativePath -or
                        [string]$file.encoding -ne "base64") {
                      throw "SMOKE_CONTENTS_METADATA_INVALID"
                    }
                    $fileContent = ([string]$file.content) -replace "\s", ""
                    if ([string]::IsNullOrWhiteSpace($fileContent)) {
                      throw "SMOKE_CONTENTS_EMPTY"
                    }
                    $fileBytes = [Convert]::FromBase64String($fileContent)
                    [IO.Directory]::CreateDirectory([IO.Path]::GetDirectoryName($targetPath)) |
                      Out-Null
                    [IO.File]::WriteAllBytes($targetPath, $fileBytes)
                    Write-Host "SMOKE_FILE_READY=$RelativePath"
                    return
                  }
                  finally {
                    $response.Dispose()
                  }
                }
                finally {
                  $request.Dispose()
                }
              }
              catch {
                Write-Host "SMOKE_BOOTSTRAP_STAGE=FETCH_FILES"
                Write-Host "SMOKE_BOOTSTRAP_ERROR_TYPE=$($_.Exception.GetType().Name)"
                if ($attempt -lt 3) {
                  Start-Sleep -Seconds @(5, 15)[$attempt - 1]
                }
              }
              finally {
                if ($null -ne $client) {
                  $client.Dispose()
                }
              }
            }
            throw "SMOKE_CONTENTS_FETCH_FAILED"
          }

          try {
            Write-Host "SMOKE_BOOTSTRAP_STAGE=$smokeStage"
            if ($env:SMOKE_TARGET_SHA -notmatch "^[0-9a-fA-F]{40}$") {
              throw "SMOKE_TARGET_SHA_INVALID"
            }
            if ([string]::IsNullOrWhiteSpace($env:GITHUB_TOKEN)) {
              throw "SMOKE_BOOTSTRAP_TOKEN_MISSING"
            }
            # Do not replace the production job's shared repository workspace.
            $runnerTempFull = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
            $smokeWorkspace = Join-Path $runnerTempFull (
              "crew-email-smoke-workspace-" + [Guid]::NewGuid().ToString("N")
            )
            if (-not [IO.Path]::GetFullPath($smokeWorkspace).StartsWith(
              $runnerTempFull.TrimEnd([IO.Path]::DirectorySeparatorChar) +
                [IO.Path]::DirectorySeparatorChar,
              [StringComparison]::OrdinalIgnoreCase
            )) {
              throw "SMOKE_WORKSPACE_OUTSIDE_RUNNER_TEMP"
            }
            [IO.Directory]::CreateDirectory($smokeWorkspace) | Out-Null
            $smokeStage = "FETCH_FILES"
            Write-Host "SMOKE_BOOTSTRAP_STAGE=$smokeStage"
            foreach ($relativePath in $requiredFiles) {
              Save-ContentsFile -RelativePath $relativePath -Workspace $smokeWorkspace
            }

            $smokeStage = "VERIFY_WORKSPACE"
            Write-Host "SMOKE_BOOTSTRAP_STAGE=$smokeStage"
            foreach ($requiredFile in $requiredFiles) {
              if (-not (Test-Path -LiteralPath (
                Join-Path $smokeWorkspace $requiredFile
              ) -PathType Leaf)) {
                throw "SMOKE_WORKSPACE_INCOMPLETE"
              }
            }
            "smoke_workspace=$smokeWorkspace" |
              Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            $smokeStage = "READY"
            Write-Host "SMOKE_BOOTSTRAP_STAGE=$smokeStage"
          }
          catch {
            Write-Host "SMOKE_BOOTSTRAP_STAGE=$smokeStage"
            Write-Host "SMOKE_BOOTSTRAP_ERROR_TYPE=$($_.Exception.GetType().Name)"
            throw "SMOKE_BOOTSTRAP_SAFE_FAILURE"
          }

      - name: Run one isolated email OTP smoke test
        working-directory: ${{ steps.bootstrap.outputs.smoke_workspace }}
        env:
          CREW_USERNAME: ${{ secrets.CREW_USERNAME }}
          CREW_PASSWORD: ${{ secrets.CREW_PASSWORD }}
          IMAP_EMAIL: ${{ secrets.IMAP_EMAIL }}
          IMAP_AUTH_CODE: ${{ secrets.IMAP_AUTH_CODE }}
          CREW_BROWSER_CHANNEL: msedge
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          python -u -B scripts/email_otp_real_smoke.py
          exit $LASTEXITCODE
