name: Restore history from debug zip

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run restore script
        run: python restore_history_from_debug_zip.py

      - name: Commit restored ICS files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add crew_schedule.ics training.ics flight.ics positioning.ics ferry.ics other.ics debug-output\ 2\(3\).zip restore_history_from_debug_zip.py || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "restore history from debug zip"
          git pull --rebase origin main
          git push origin main
