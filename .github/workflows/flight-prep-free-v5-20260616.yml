name: 生成航前准备
run-name: ${{ inputs.target_date }} 航前准备

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: '目标日期 YYYY-MM-DD'
        required: true
        type: string
      days_ahead:
        description: '手动运行时生成几天后的任务'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
concurrency:
  group: crew-calendar
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install free dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-agent.txt

      - name: Determine target date mode
        id: target
        shell: bash
        run: |
          DAYS="1"
          TARGET="${{ inputs.target_date }}"
          DAYS="${{ inputs.days_ahead }}"

          echo "days=$DAYS" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Generate free rule-based flight preparation
        shell: bash
        run: |
          ARGS=(--repo . --days-ahead "${{ steps.target.outputs.days }}")
          if [[ -n "${{ steps.target.outputs.target }}" ]]; then
            ARGS+=(--target-date "${{ steps.target.outputs.target }}")
          fi
          python crew_agents/flight_prep_agent.py "${ARGS[@]}"

      - name: Upload preparation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flight-preparation-free-v5-${{ github.run_number }}
          path: |
            flight_preparation/
            agent_output/flight_prep/
          if-no-files-found: warn
          retention-days: 30

      - name: Commit successful preparation
        if: ${{ success() }}
        shell: bash
        run: |
          python scripts/publish_flight_preparation.py --repo . --target-date "${{ steps.target.outputs.target }}"
