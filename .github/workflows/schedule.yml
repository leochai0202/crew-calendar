name: 更新机组日历

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions 使用 UTC
    # 日历更新：北京时间 09:07 / 15:17 / 21:27
    - cron: '7 1 * * *'
    - cron: '17 7 * * *'
    - cron: '27 13 * * *'
    # 仅检查航前准备：北京时间 06:37 / 18:37（D+2）、09:43（D+1）
    - cron: '37 22 * * *'
    - cron: '37 10 * * *'
    - cron: '43 1 * * *'

concurrency:
  group: crew-calendar
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: [self-hosted, Windows, X64, crew-calendar]
    timeout-minutes: 30

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Bootstrap repository from GitHub API
        id: bootstrap
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:GITHUB_TOKEN)) {
            throw "GITHUB_TOKEN is required"
          }

          function New-GitHubHttpClient {
            $handler = [System.Net.Http.HttpClientHandler]::new()
            $handler.AllowAutoRedirect = $false
            $client = [System.Net.Http.HttpClient]::new($handler)
            $client.Timeout = [TimeSpan]::FromSeconds(45)
            $client.DefaultRequestHeaders.UserAgent.ParseAdd(
              "crew-calendar-workflow-bootstrap"
            )
            return $client
          }

          function Invoke-GitHubApiJson {
            param(
              [Parameter(Mandatory = $true)]
              [string]$Uri,
              [Parameter(Mandatory = $true)]
              [string]$Label
            )
            $lastError = $null
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              $client = New-GitHubHttpClient
              try {
                $request = [System.Net.Http.HttpRequestMessage]::new(
                  [System.Net.Http.HttpMethod]::Get,
                  $Uri
                )
                try {
                  $request.Headers.Authorization = (
                    [System.Net.Http.Headers.AuthenticationHeaderValue]::new(
                      "Bearer",
                      $env:GITHUB_TOKEN
                    )
                  )
                  $request.Headers.Accept.ParseAdd("application/vnd.github+json")
                  $request.Headers.Add("X-GitHub-Api-Version", "2022-11-28")
                  $response = $client.SendAsync($request).GetAwaiter().GetResult()
                  try {
                    if (-not $response.IsSuccessStatusCode) {
                      throw "$Label returned HTTP $([int]$response.StatusCode)"
                    }
                    $body = $response.Content.ReadAsStringAsync().GetAwaiter().GetResult()
                    return $body | ConvertFrom-Json
                  }
                  finally {
                    $response.Dispose()
                  }
                }
                finally {
                  $request.Dispose()
                }
              }
              catch {
                $lastError = $_
                Write-Host "$Label attempt $attempt/3 failed"
                if ($attempt -lt 3) {
                  Start-Sleep -Seconds @(5, 15)[$attempt - 1]
                }
              }
              finally {
                $client.Dispose()
              }
            }
            throw "$Label failed after 3 attempts: $($lastError.Exception.GetType().Name)"
          }

          $apiBase = "https://api.github.com"
          $refUri = "$apiBase/repos/$env:GITHUB_REPOSITORY/git/ref/heads/main"
          $mainRef = Invoke-GitHubApiJson -Uri $refUri -Label "Main ref lookup"
          $bootstrapSha = [string]$mainRef.object.sha
          if ($bootstrapSha -notmatch "^[0-9a-fA-F]{40}$") {
            throw "Main ref response did not contain a full commit SHA"
          }
          Write-Host "BOOTSTRAP_MAIN_SHA=$bootstrapSha"

          $helperUri = (
            "$apiBase/repos/$env:GITHUB_REPOSITORY/contents/" +
            "scripts/bootstrap_repository.ps1?ref=$bootstrapSha"
          )
          $helper = Invoke-GitHubApiJson -Uri $helperUri -Label "Bootstrap helper lookup"
          if ([string]$helper.encoding -ne "base64") {
            throw "Bootstrap helper response did not use base64 encoding"
          }
          $helperContent = ([string]$helper.content) -replace "\s", ""
          if ([string]::IsNullOrWhiteSpace($helperContent)) {
            throw "Bootstrap helper response was empty"
          }
          try {
            $helperBytes = [Convert]::FromBase64String($helperContent)
          }
          catch {
            throw "Bootstrap helper response contained invalid base64"
          }

          $helperPath = Join-Path $env:RUNNER_TEMP (
            "crew-calendar-bootstrap-" + [Guid]::NewGuid().ToString("N") + ".ps1"
          )
          [IO.File]::WriteAllBytes($helperPath, $helperBytes)
          try {
            & $helperPath `
              -Repository $env:GITHUB_REPOSITORY `
              -TargetSha $bootstrapSha `
              -Workspace $env:GITHUB_WORKSPACE `
              -RunnerTemp $env:RUNNER_TEMP
          }
          finally {
            if (Test-Path -LiteralPath $helperPath) {
              Remove-Item -LiteralPath $helperPath -Force
            }
          }

      - name: Verify self-hosted runtime
        run: |
          $ErrorActionPreference = "Stop"
          python --version
          python -c "import playwright, PIL, pytesseract, ics, requests"

      - name: Determine schedule mode
        id: schedule_mode
        run: |
          $ErrorActionPreference = "Stop"
          $eventName = "${{ github.event_name }}"
          $scheduledCron = "${{ github.event.schedule }}"
          $actualStartUtc = [DateTimeOffset]::UtcNow.ToString("o")
          $calendarCrons = @(
            "7 1 * * *",
            "17 7 * * *",
            "27 13 * * *"
          )

          if ($eventName -eq "workflow_dispatch" -or $scheduledCron -in $calendarCrons) {
            $mode = "CALENDAR_UPDATE"
            $runScraper = "true"
            $daysAhead = "1"
          }
          elseif ($scheduledCron -eq "43 1 * * *") {
            $mode = "D1_PREP_GUARD"
            $runScraper = "false"
            $daysAhead = "1"
          }
          elseif ($scheduledCron -in @("37 22 * * *", "37 10 * * *")) {
            $mode = "D2_PREP_INITIAL"
            $runScraper = "false"
            $daysAhead = "2"
          }
          else {
            throw "Unsupported schedule trigger"
          }

          Write-Host "SCHEDULE_MODE=$mode"
          "mode=$mode" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "run_scraper=$runScraper" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "days_ahead=$daysAhead" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "actual_start_utc=$actualStartUtc" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Run scraper
        id: scraper
        if: ${{ steps.schedule_mode.outputs.run_scraper == 'true' }}
        env:
          CREW_STORAGE_STATE_B64: ${{ secrets.CREW_STORAGE_STATE_B64 }}
          CREW_USERNAME: ${{ secrets.CREW_USERNAME }}
          CREW_PASSWORD: ${{ secrets.CREW_PASSWORD }}
          CREW_PHONE: ${{ secrets.CREW_PHONE }}
          IMAP_EMAIL: ${{ secrets.IMAP_EMAIL }}
          IMAP_AUTH_CODE: ${{ secrets.IMAP_AUTH_CODE }}
          CREW_PERSISTENT_PROFILE_DIR: C:\crew-calendar-data\browser-profile
          CREW_AUTH_BACKUP_PATH: C:\crew-calendar-data\auth-backup\crew-auth-session.json
          CREW_AUTH_CONTROL_PATH: C:\crew-calendar-data\auth-control.json
          CREW_BROWSER_CHANNEL: msedge
          HEADLESS: '1'
          CREW_AUTH_DIAGNOSTIC_PATH: ${{ runner.temp }}\crew-auth-diagnostic.json
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          python crew_calendar_email_entry.py
          $exitCode = $LASTEXITCODE

          $authStatus = switch ($exitCode) {
            0 { "AUTHENTICATED" }
            3 { "LOGIN_REQUIRED" }
            4 { "ADDITIONAL_VERIFICATION_REQUIRED" }
            5 { "PAGE_CHANGED_OR_UNKNOWN" }
            6 { "NETWORK_OR_SITE_ERROR" }
            7 { "AUTH_DEFERRED_OTP_COOLDOWN" }
            9 { "LOGIN_REQUIRED_DYNAMIC_OTP" }
            default { "SCRAPER_ERROR" }
          }

          "auth_status=$authStatus" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if ($authStatus -eq "AUTH_DEFERRED_OTP_COOLDOWN") {
            Write-Host "CALENDAR_UPDATE=SKIPPED_PRESERVE_LAST_GOOD"
            exit 0
          }
          exit $exitCode

      - name: Clean ICS people lists
        if: ${{ steps.scraper.outcome == 'success' && steps.scraper.outputs.auth_status == 'AUTHENTICATED' }}
        run: |
          python clean_ics_people.py
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Publish ICS files through GitHub API
        id: ics_publish
        if: ${{ steps.scraper.outcome == 'success' && steps.scraper.outputs.auth_status == 'AUTHENTICATED' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $candidateFiles = @(
            Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Filter "*.ics" -File |
              ForEach-Object { $_.Name }
          )
          if (Test-Path -LiteralPath "airport_aliases.json") {
            $candidateFiles += "airport_aliases.json"
          }
          if ($candidateFiles.Count -eq 0) {
            throw "No approved calendar output files were found"
          }

          $publisherArgs = @(
            "github_api_publish.py",
            "--repository", $env:GITHUB_REPOSITORY,
            "--branch", "main",
            "--message", "Update crew calendar",
            "--root", $env:GITHUB_WORKSPACE,
            "--github-output", $env:GITHUB_OUTPUT,
            "--status-prefix", "ICS_API",
            "--files"
          ) + $candidateFiles
          python @publisherArgs
          exit $LASTEXITCODE

      - name: Check standalone flight preparation slot
        id: flight_prep_check
        if: ${{ steps.schedule_mode.outputs.run_scraper == 'false' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/check_flight_prep_schedule.py `
            --repo $env:GITHUB_WORKSPACE `
            --days-ahead "${{ steps.schedule_mode.outputs.days_ahead }}" `
            --scheduled-cron "${{ github.event.schedule }}" `
            --actual-start-utc "${{ steps.schedule_mode.outputs.actual_start_utc }}" `
            --github-output $env:GITHUB_OUTPUT `
            --dispatch
          exit $LASTEXITCODE

      - name: Check existing D+1 flight preparation after calendar update
        id: calendar_d1_prep_check
        if: >-
          ${{ steps.schedule_mode.outputs.run_scraper == 'true' &&
              steps.scraper.outcome == 'success' &&
              steps.scraper.outputs.auth_status == 'AUTHENTICATED' &&
              steps.ics_publish.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/check_flight_prep_schedule.py `
            --repo $env:GITHUB_WORKSPACE `
            --days-ahead "1" `
            --scheduled-cron "${{ github.event.schedule }}" `
            --actual-start-utc "${{ steps.schedule_mode.outputs.actual_start_utc }}" `
            --existing-only `
            --github-output $env:GITHUB_OUTPUT `
            --dispatch
          exit $LASTEXITCODE

      - name: Check existing D+2 flight preparation after calendar update
        id: calendar_d2_prep_check
        if: >-
          ${{ steps.schedule_mode.outputs.run_scraper == 'true' &&
              steps.scraper.outcome == 'success' &&
              steps.scraper.outputs.auth_status == 'AUTHENTICATED' &&
              steps.ics_publish.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/check_flight_prep_schedule.py `
            --repo $env:GITHUB_WORKSPACE `
            --days-ahead "2" `
            --scheduled-cron "${{ github.event.schedule }}" `
            --actual-start-utc "${{ steps.schedule_mode.outputs.actual_start_utc }}" `
            --existing-only `
            --github-output $env:GITHUB_OUTPUT `
            --dispatch
          exit $LASTEXITCODE

      - name: Publish invalidated flight preparation state
        if: >-
          ${{ always() &&
              (steps.flight_prep_check.outputs.state_changed == 'true' ||
               steps.calendar_d1_prep_check.outputs.state_changed == 'true' ||
               steps.calendar_d2_prep_check.outputs.state_changed == 'true') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $stateFiles = @(
            "${{ steps.flight_prep_check.outputs.state_files }}",
            "${{ steps.calendar_d1_prep_check.outputs.state_files }}",
            "${{ steps.calendar_d2_prep_check.outputs.state_files }}"
          ) | ForEach-Object { $_.Split(";") } |
            Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
            Sort-Object -Unique
          if ($stateFiles.Count -eq 0) {
            throw "Flight preparation state change did not provide files"
          }

          $publisherArgs = @(
            "github_api_publish.py",
            "--repository", $env:GITHUB_REPOSITORY,
            "--branch", "main",
            "--message", "Invalidate flight preparation with no current task",
            "--root", $env:GITHUB_WORKSPACE,
            "--status-prefix", "FLIGHT_PREP_STATE_API",
            "--files"
          ) + $stateFiles
          python @publisherArgs
          exit $LASTEXITCODE

      - name: Send authentication status notification
        id: auth_notification
        if: ${{ always() && steps.schedule_mode.outputs.run_scraper == 'true' }}
        continue-on-error: true
        env:
          AUTH_STATUS: ${{ steps.scraper.outputs.auth_status }}
          GMAIL_SMTP_USER: ${{ secrets.GMAIL_SMTP_USER }}
          GMAIL_SMTP_APP_PASSWORD: ${{ secrets.GMAIL_SMTP_APP_PASSWORD }}
          CREW_NOTIFY_EMAIL: ${{ secrets.CREW_NOTIFY_EMAIL }}
        run: |
          $authStatus = if ($env:AUTH_STATUS) {
            $env:AUTH_STATUS
          } else {
            "SCRAPER_ERROR"
          }
          python crew_auth_notification.py `
            --auth-status $authStatus `
            --state-file state/auth_notification_state.json
          exit $LASTEXITCODE

      - name: Publish authentication notification state through GitHub API
        if: >-
          ${{ always() &&
              steps.schedule_mode.outputs.run_scraper == 'true' &&
              steps.auth_notification.outcome == 'success' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $stateFile = "state/auth_notification_state.json"
          if (-not (Test-Path -LiteralPath $stateFile)) {
            exit 0
          }

          python github_api_publish.py `
            --repository $env:GITHUB_REPOSITORY `
            --branch main `
            --message "Update authentication notification state" `
            --root $env:GITHUB_WORKSPACE `
            --status-prefix AUTH_STATE_API `
            --files $stateFile
          exit $LASTEXITCODE
