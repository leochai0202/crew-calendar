name: Update Crew Calendar

on:
  workflow_dispatch:
  schedule:
    - cron: '20 9 * * *'
    - cron: '20 10 * * *'
    - cron: '20 11 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install pillow pytesseract playwright
          playwright install chromium

      - name: Run scraper
        env:
          CREW_USERNAME: ${{ secrets.CREW_USERNAME }}
          CREW_PASSWORD: ${{ secrets.CREW_PASSWORD }}
          HEADLESS: "1"
        run: |
          python main.py

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-output
          path: |
            debug_output
            *.ics

      - name: Commit and push ICS files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.ics airport_aliases.json || true
          git diff --cached --quiet || git commit -m "Update crew calendar"
          git push
