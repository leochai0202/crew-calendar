name: Update Crew Calendar

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions 使用 UTC
    # 北京时间 17:30 = UTC 09:30
    # 北京时间 18:30 = UTC 10:30
    # 北京时间 19:30 = UTC 11:30
    - cron: '30 9 * * *'
    - cron: '30 10 * * *'
    - cron: '30 11 * * *'

concurrency:
  group: crew-calendar
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install pillow pytesseract playwright ddddocr
          playwright install --with-deps chromium

      - name: Run scraper
        env:
          CREW_USERNAME: ${{ secrets.CREW_USERNAME }}
          CREW_PASSWORD: ${{ secrets.CREW_PASSWORD }}
          HEADLESS: "1"
        run: |
          python main.py

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-output
          path: debug_output/
          if-no-files-found: ignore

      - name: Commit and push ICS files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add *.ics airport_aliases.json || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update crew calendar"
          git push
