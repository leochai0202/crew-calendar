name: Update Crew Calendar

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions 使用 UTC
    # 北京时间 17:30 = UTC 09:30
    # 北京时间 18:30 = UTC 10:30
    # 北京时间 19:30 = UTC 11:30
    - cron: '30 9 * * *'
    - cron: '30 10 * * *'
    - cron: '30 11 * * *'

concurrency:
  group: crew-calendar
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run scraper
        id: scraper
        env:
          CREW_STORAGE_STATE_B64: ${{ secrets.CREW_STORAGE_STATE_B64 }}
        shell: bash
        run: |
          set +e
          python crew_calendar_main.py
          exit_code=$?
          set -e

          case "$exit_code" in
            0) auth_status="AUTHENTICATED" ;;
            3) auth_status="LOGIN_REQUIRED" ;;
            4) auth_status="ADDITIONAL_VERIFICATION_REQUIRED" ;;
            5) auth_status="PAGE_CHANGED_OR_UNKNOWN" ;;
            6) auth_status="NETWORK_OR_SITE_ERROR" ;;
            *) auth_status="SCRAPER_ERROR" ;;
          esac

          echo "auth_status=$auth_status" >> "$GITHUB_OUTPUT"
          exit "$exit_code"

      - name: Clean ICS people lists
        if: ${{ steps.scraper.outcome == 'success' && steps.scraper.outputs.auth_status == 'AUTHENTICATED' }}
        run: |
          python clean_ics_people.py

      - name: Commit and push ICS files
        if: ${{ steps.scraper.outcome == 'success' && steps.scraper.outputs.auth_status == 'AUTHENTICATED' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add *.ics airport_aliases.json || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update crew calendar"
          git push

      - name: Send authentication status notification
        id: auth_notification
        if: ${{ always() }}
        continue-on-error: true
        env:
          AUTH_STATUS: ${{ steps.scraper.outputs.auth_status }}
          GMAIL_SMTP_USER: ${{ secrets.GMAIL_SMTP_USER }}
          GMAIL_SMTP_APP_PASSWORD: ${{ secrets.GMAIL_SMTP_APP_PASSWORD }}
          GMAIL_NOTIFY_TO: ${{ secrets.GMAIL_NOTIFY_TO }}
        shell: bash
        run: |
          python crew_auth_notification.py \
            --auth-status "${AUTH_STATUS:-SCRAPER_ERROR}" \
            --state-file state/auth_notification_state.json

      - name: Commit authentication notification state
        if: ${{ always() && steps.auth_notification.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          if [ ! -f state/auth_notification_state.json ]; then
            exit 0
          fi

          git add -- state/auth_notification_state.json

          if git diff --cached --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update authentication notification state"
          git push
