name: Update Crew Calendar

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions 使用 UTC
    # 北京时间 17:30 = UTC 09:30
    # 北京时间 18:30 = UTC 10:30
    # 北京时间 19:30 = UTC 11:30
    - cron: '30 9 * * *'
    - cron: '30 10 * * *'
    - cron: '30 11 * * *'

concurrency:
  group: crew-calendar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, Windows, X64, crew-calendar]
    timeout-minutes: 20

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Bootstrap repository from GitHub API
        id: bootstrap
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:GITHUB_TOKEN)) {
            throw "GITHUB_TOKEN is required"
          }

          function New-DirectHttpClient {
            $handler = [System.Net.Http.HttpClientHandler]::new()
            $handler.UseProxy = $false
            $handler.AllowAutoRedirect = $false
            $client = [System.Net.Http.HttpClient]::new($handler)
            $client.Timeout = [TimeSpan]::FromSeconds(45)
            $client.DefaultRequestHeaders.UserAgent.ParseAdd(
              "crew-calendar-workflow-bootstrap"
            )
            return $client
          }

          function Invoke-DirectApiJson {
            param(
              [Parameter(Mandatory = $true)]
              [string]$Uri,
              [Parameter(Mandatory = $true)]
              [string]$Label
            )
            $lastError = $null
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              $client = New-DirectHttpClient
              try {
                $request = [System.Net.Http.HttpRequestMessage]::new(
                  [System.Net.Http.HttpMethod]::Get,
                  $Uri
                )
                try {
                  $request.Headers.Authorization = (
                    [System.Net.Http.Headers.AuthenticationHeaderValue]::new(
                      "Bearer",
                      $env:GITHUB_TOKEN
                    )
                  )
                  $request.Headers.Accept.ParseAdd("application/vnd.github+json")
                  $request.Headers.Add("X-GitHub-Api-Version", "2022-11-28")
                  $response = $client.SendAsync($request).GetAwaiter().GetResult()
                  try {
                    if (-not $response.IsSuccessStatusCode) {
                      throw "$Label returned HTTP $([int]$response.StatusCode)"
                    }
                    $body = $response.Content.ReadAsStringAsync().GetAwaiter().GetResult()
                    return $body | ConvertFrom-Json
                  }
                  finally {
                    $response.Dispose()
                  }
                }
                finally {
                  $request.Dispose()
                }
              }
              catch {
                $lastError = $_
                Write-Host "$Label attempt $attempt/3 failed"
                if ($attempt -lt 3) {
                  Start-Sleep -Seconds @(5, 15)[$attempt - 1]
                }
              }
              finally {
                $client.Dispose()
              }
            }
            throw "$Label failed after 3 attempts: $($lastError.Exception.GetType().Name)"
          }

          $apiBase = "https://api.github.com"
          $refUri = "$apiBase/repos/$env:GITHUB_REPOSITORY/git/ref/heads/main"
          $mainRef = Invoke-DirectApiJson -Uri $refUri -Label "Main ref lookup"
          $bootstrapSha = [string]$mainRef.object.sha
          if ($bootstrapSha -notmatch "^[0-9a-fA-F]{40}$") {
            throw "Main ref response did not contain a full commit SHA"
          }
          Write-Host "BOOTSTRAP_MAIN_SHA=$bootstrapSha"

          $helperUri = (
            "$apiBase/repos/$env:GITHUB_REPOSITORY/contents/" +
            "scripts/bootstrap_repository.ps1?ref=$bootstrapSha"
          )
          $helper = Invoke-DirectApiJson -Uri $helperUri -Label "Bootstrap helper lookup"
          if ([string]$helper.encoding -ne "base64") {
            throw "Bootstrap helper response did not use base64 encoding"
          }
          $helperContent = ([string]$helper.content) -replace "\s", ""
          if ([string]::IsNullOrWhiteSpace($helperContent)) {
            throw "Bootstrap helper response was empty"
          }
          try {
            $helperBytes = [Convert]::FromBase64String($helperContent)
          }
          catch {
            throw "Bootstrap helper response contained invalid base64"
          }

          $helperPath = Join-Path $env:RUNNER_TEMP (
            "crew-calendar-bootstrap-" + [Guid]::NewGuid().ToString("N") + ".ps1"
          )
          [IO.File]::WriteAllBytes($helperPath, $helperBytes)
          try {
            & $helperPath `
              -Repository $env:GITHUB_REPOSITORY `
              -TargetSha $bootstrapSha `
              -Workspace $env:GITHUB_WORKSPACE `
              -RunnerTemp $env:RUNNER_TEMP
          }
          finally {
            if (Test-Path -LiteralPath $helperPath) {
              Remove-Item -LiteralPath $helperPath -Force
            }
          }

      - name: Verify self-hosted runtime
        run: |
          $ErrorActionPreference = "Stop"
          python --version
          python -c "import playwright, PIL, pytesseract, ics, requests"

      - name: Run scraper
        id: scraper
        env:
          CREW_STORAGE_STATE_B64: ${{ secrets.CREW_STORAGE_STATE_B64 }}
          CREW_PHONE: ${{ secrets.CREW_PHONE }}
          IMAP_EMAIL: ${{ secrets.IMAP_EMAIL }}
          IMAP_AUTH_CODE: ${{ secrets.IMAP_AUTH_CODE }}
          CREW_PERSISTENT_PROFILE_DIR: C:\crew-calendar-data\browser-profile
          CREW_AUTH_BACKUP_PATH: C:\crew-calendar-data\auth-backup\crew-auth-session.json
          CREW_AUTH_CONTROL_PATH: C:\crew-calendar-data\auth-control.json
          CREW_BROWSER_CHANNEL: msedge
          HEADLESS: '1'
          CREW_AUTH_DIAGNOSTIC_PATH: ${{ runner.temp }}\crew-auth-diagnostic.json
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          python crew_calendar_main.py
          $exitCode = $LASTEXITCODE

          $authStatus = switch ($exitCode) {
            0 { "AUTHENTICATED" }
            3 { "LOGIN_REQUIRED" }
            4 { "ADDITIONAL_VERIFICATION_REQUIRED" }
            5 { "PAGE_CHANGED_OR_UNKNOWN" }
            6 { "NETWORK_OR_SITE_ERROR" }
            7 { "AUTH_DEFERRED_OTP_COOLDOWN" }
            9 { "LOGIN_REQUIRED_DYNAMIC_OTP" }
            default { "SCRAPER_ERROR" }
          }

          "auth_status=$authStatus" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if ($authStatus -eq "AUTH_DEFERRED_OTP_COOLDOWN") {
            Write-Host "CALENDAR_UPDATE=SKIPPED_PRESERVE_LAST_GOOD"
            exit 0
          }
          exit $exitCode

      - name: Clean ICS people lists
        if: ${{ steps.scraper.outcome == 'success' && steps.scraper.outputs.auth_status == 'AUTHENTICATED' }}
        run: |
          python clean_ics_people.py
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Publish ICS files through GitHub API
        id: ics_publish
        if: ${{ steps.scraper.outcome == 'success' && steps.scraper.outputs.auth_status == 'AUTHENTICATED' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $candidateFiles = @(
            Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Filter "*.ics" -File |
              ForEach-Object { $_.Name }
          )
          if (Test-Path -LiteralPath "airport_aliases.json") {
            $candidateFiles += "airport_aliases.json"
          }
          if ($candidateFiles.Count -eq 0) {
            throw "No approved calendar output files were found"
          }

          $publisherArgs = @(
            "github_api_publish.py",
            "--repository", $env:GITHUB_REPOSITORY,
            "--branch", "main",
            "--message", "Update crew calendar",
            "--root", $env:GITHUB_WORKSPACE,
            "--github-output", $env:GITHUB_OUTPUT,
            "--status-prefix", "ICS_API",
            "--files"
          ) + $candidateFiles
          python @publisherArgs
          exit $LASTEXITCODE

      - name: Send authentication status notification
        id: auth_notification
        if: ${{ always() }}
        continue-on-error: true
        env:
          AUTH_STATUS: ${{ steps.scraper.outputs.auth_status }}
          GMAIL_SMTP_USER: ${{ secrets.GMAIL_SMTP_USER }}
          GMAIL_SMTP_APP_PASSWORD: ${{ secrets.GMAIL_SMTP_APP_PASSWORD }}
          CREW_NOTIFY_EMAIL: ${{ secrets.CREW_NOTIFY_EMAIL }}
        run: |
          $authStatus = if ($env:AUTH_STATUS) {
            $env:AUTH_STATUS
          } else {
            "SCRAPER_ERROR"
          }
          python crew_auth_notification.py `
            --auth-status $authStatus `
            --state-file state/auth_notification_state.json
          exit $LASTEXITCODE

      - name: Publish authentication notification state through GitHub API
        if: ${{ always() && steps.auth_notification.outcome == 'success' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $stateFile = "state/auth_notification_state.json"
          if (-not (Test-Path -LiteralPath $stateFile)) {
            exit 0
          }

          python github_api_publish.py `
            --repository $env:GITHUB_REPOSITORY `
            --branch main `
            --message "Update authentication notification state" `
            --root $env:GITHUB_WORKSPACE `
            --status-prefix AUTH_STATE_API `
            --files $stateFile
          exit $LASTEXITCODE
