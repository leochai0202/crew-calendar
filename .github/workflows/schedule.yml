name: Update Crew Calendar

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions 使用 UTC
    # 北京时间 17:30 = UTC 09:30
    # 北京时间 18:30 = UTC 10:30
    # 北京时间 19:30 = UTC 11:30
    - cron: '30 9 * * *'
    - cron: '30 10 * * *'
    - cron: '30 11 * * *'

concurrency:
  group: crew-calendar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, Windows, X64, crew-calendar]
    timeout-minutes: 20

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify self-hosted runtime
        run: |
          $ErrorActionPreference = "Stop"
          python --version
          python -c "import playwright, PIL, pytesseract, ics, requests"

      - name: Run scraper
        id: scraper
        env:
          CREW_STORAGE_STATE_B64: ${{ secrets.CREW_STORAGE_STATE_B64 }}
          CREW_PHONE: ${{ secrets.CREW_PHONE }}
          IMAP_EMAIL: ${{ secrets.IMAP_EMAIL }}
          IMAP_AUTH_CODE: ${{ secrets.IMAP_AUTH_CODE }}
          CREW_PERSISTENT_PROFILE_DIR: C:\crew-calendar-data\browser-profile
          CREW_AUTH_BACKUP_PATH: C:\crew-calendar-data\auth-backup\crew-auth-session.json
          CREW_BROWSER_CHANNEL: msedge
          HEADLESS: '1'
          CREW_AUTH_DIAGNOSTIC_PATH: ${{ runner.temp }}\crew-auth-diagnostic.json
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          python crew_calendar_main.py
          $exitCode = $LASTEXITCODE

          $authStatus = switch ($exitCode) {
            0 { "AUTHENTICATED" }
            3 { "LOGIN_REQUIRED" }
            4 { "ADDITIONAL_VERIFICATION_REQUIRED" }
            5 { "PAGE_CHANGED_OR_UNKNOWN" }
            6 { "NETWORK_OR_SITE_ERROR" }
            default { "SCRAPER_ERROR" }
          }

          "auth_status=$authStatus" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          exit $exitCode

      - name: Upload safe authentication diagnostic
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: crew-auth-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}\crew-auth-diagnostic.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean ICS people lists
        if: ${{ steps.scraper.outcome == 'success' && steps.scraper.outputs.auth_status == 'AUTHENTICATED' }}
        run: |
          python clean_ics_people.py
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Commit and push ICS files
        if: ${{ steps.scraper.outcome == 'success' && steps.scraper.outputs.auth_status == 'AUTHENTICATED' }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- *.ics airport_aliases.json

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No changes to commit"
            exit 0
          }
          if ($LASTEXITCODE -ne 1) {
            exit $LASTEXITCODE
          }

          git commit -m "Update crew calendar"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          git push
          exit $LASTEXITCODE

      - name: Send authentication status notification
        id: auth_notification
        if: ${{ always() }}
        continue-on-error: true
        env:
          AUTH_STATUS: ${{ steps.scraper.outputs.auth_status }}
          GMAIL_SMTP_USER: ${{ secrets.GMAIL_SMTP_USER }}
          GMAIL_SMTP_APP_PASSWORD: ${{ secrets.GMAIL_SMTP_APP_PASSWORD }}
          CREW_NOTIFY_EMAIL: ${{ secrets.CREW_NOTIFY_EMAIL }}
        run: |
          $authStatus = if ($env:AUTH_STATUS) {
            $env:AUTH_STATUS
          } else {
            "SCRAPER_ERROR"
          }
          python crew_auth_notification.py `
            --auth-status $authStatus `
            --state-file state/auth_notification_state.json
          exit $LASTEXITCODE

      - name: Commit authentication notification state
        if: ${{ always() && steps.auth_notification.outcome == 'success' }}
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $stateFile = "state/auth_notification_state.json"
          if (-not (Test-Path -LiteralPath $stateFile)) {
            exit 0
          }

          git add -- $stateFile
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            exit 0
          }
          if ($LASTEXITCODE -ne 1) {
            exit $LASTEXITCODE
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update authentication notification state"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          git push
          exit $LASTEXITCODE
