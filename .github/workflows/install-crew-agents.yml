      - name: Install without touching current production files
        shell: bash
        run: |
          set -euo pipefail

          hash_protected() {
            for f in crew_calendar_main.py clean_ics_people.py airport_aliases.json .github/workflows/schedule.yml; do
              if [[ -f "$f" ]]; then
                sha256sum "$f"
              else
                echo "MISSING  $f"
              fi
            done
          }

          hash_protected > /tmp/protected-before.txt
          cp -a /tmp/crew-agents-stage/. .
          hash_protected > /tmp/protected-after.txt

          if ! diff -u /tmp/protected-before.txt /tmp/protected-after.txt; then
            echo "Protected production files changed; installation aborted."
            exit 1
          fi

          # Installer deletes itself after a successful installation.
          rm -f .github/workflows/install-crew-agents.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             .github/workflows/flight-prep-agent.yml             .github/workflows/crew-maintenance-agent.yml             crew_agents config knowledge tests flight_preparation             requirements-agent.txt pytest.ini MANIFEST.json README_安装与使用.md
          git add -u .github/workflows/install-crew-agents.yml || true

          if git diff --cached --quiet; then
            echo "Nothing to install"
            exit 0
          fi

          git commit -m "Install crew calendar Agents"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

          echo "## Agent 安装完成" >> "$GITHUB_STEP_SUMMARY"
          echo "现有 schedule.yml、主程序、清洗脚本和 airport_aliases.json 均未修改。" >> "$GITHUB_STEP_SUMMARY"
