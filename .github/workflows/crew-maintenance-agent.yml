name: Crew Calendar Maintenance Agent

on:
  workflow_dispatch:
    inputs:
      run_scraper:
        description: '先运行一次当前爬虫以生成最新诊断资料'
        required: true
        default: true
        type: boolean
      model:
        description: 'OpenAI API 模型'
        required: true
        default: 'gpt-5.1'
        type: string

concurrency:
  group: crew-calendar-maintenance-agent
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Agent dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-agent.txt

      - name: Install scraper dependencies
        if: ${{ inputs.run_scraper == true }}
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          pip install pillow pytesseract playwright ddddocr
          playwright install --with-deps chromium

      - name: Run scraper for diagnostics only
        if: ${{ inputs.run_scraper == true }}
        continue-on-error: true
        env:
          CREW_USERNAME: ${{ secrets.CREW_USERNAME }}
          CREW_PASSWORD: ${{ secrets.CREW_PASSWORD }}
          HEADLESS: '1'
        shell: bash
        run: |
          mkdir -p agent_run
          set +e
          python crew_calendar_main.py 2>&1 | tee agent_run/scraper.log
          SCRAPER_EXIT=${PIPESTATUS[0]}
          echo "$SCRAPER_EXIT" > agent_run/scraper_exit.txt

          python clean_ics_people.py 2>&1 | tee agent_run/cleaner.log
          CLEANER_EXIT=${PIPESTATUS[0]}
          echo "$CLEANER_EXIT" > agent_run/cleaner_exit.txt
          exit 0

      - name: Run safe maintenance Agent
        if: always()
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MAINTENANCE_MODEL: ${{ inputs.model }}
        run: |
          python crew_agents/maintenance_agent.py \
            --repo . \
            --debug-dir debug_output \
            --output-dir agent_output/maintenance \
            --model "${{ inputs.model }}"

      - name: Upload Agent result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crew-maintenance-agent-${{ github.run_number }}
          path: |
            agent_output/maintenance/
            agent_run/
            debug_output/
          if-no-files-found: warn
          retention-days: 30
