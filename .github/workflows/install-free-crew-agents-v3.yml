name: Install Free Crew Agent Files v3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install free non-workflow files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p crew_agents
          echo '' | base64 -d > crew_agents/flight_prep_agent.py
          mkdir -p crew_agents
          echo '' | base64 -d > crew_agents/maintenance_agent.py
          echo 'cmVxdWVzdHM+PTIuMzIsPDMuMApweXRlc3Q+PTguMCw8OS4wCg==' | base64 -d > requirements-agent.txt

      - name: Verify Python syntax and tests
        shell: bash
        run: |
          python -m py_compile crew_agents/flight_prep_agent.py crew_agents/maintenance_agent.py
          python -m pip install --upgrade pip
          pip install -r requirements-agent.txt
          pytest -q

      - name: Commit installed free files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crew_agents/flight_prep_agent.py crew_agents/maintenance_agent.py requirements-agent.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Switch crew agents to free rule-based mode"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## 免费 Agent 基础文件已安装"
            echo
            echo "- 不再需要 OPENAI_API_KEY"
            echo "- 航前准备改为规则和知识库生成"
            echo "- 维护 Agent 改为只检测和出报告，不自动改正式文件"
            echo "- 下一步手动覆盖两个 workflow 文件"
          } >> "$GITHUB_STEP_SUMMARY"
